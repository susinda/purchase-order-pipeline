name: Deploy APIs, DAGs, and dbt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: What to deploy or verify (all checks the selected commit for changes)
        type: choice
        required: true
        default: all
        options: [all, api, dags, dbt, verify]

permissions:
  contents: read

concurrency:
  group: api-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check_changes:
    name: Select deployment jobs
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.changes.outputs.apis }}
      astro: ${{ steps.changes.outputs.astro }}
      dbt: ${{ steps.changes.outputs.dbt }}
      verify_only: ${{ steps.changes.outputs.verify_only }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.component == 'all')
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select components
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMPONENT: ${{ inputs.component }}
        run: |
          apis=false
          astro=false
          dbt=false
          verify_only=false
          case "$GITHUB_EVENT_NAME:$COMPONENT" in
            pull_request:*|workflow_dispatch:api) apis=true ;;
            workflow_dispatch:dags) astro=true ;;
            workflow_dispatch:dbt) dbt=true ;;
            workflow_dispatch:verify) verify_only=true ;;
            push:*|workflow_dispatch:all)
              if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
                BEFORE_SHA=$(git rev-parse --verify --quiet "$GITHUB_SHA^" || true)
              fi
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
                BEFORE_SHA=$(git hash-object -w -t tree --stdin < /dev/null)
              fi
              api_changes=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- api/)
              astro_changes=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- airflow/)
              dbt_changes=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- \
                snowflake/dbt/ ':(exclude)snowflake/dbt/ddl/')
              if [[ -n "$api_changes" ]]; then
                apis=true
              fi
              if [[ -n "$astro_changes" ]]; then
                astro=true
              fi
              if [[ -n "$dbt_changes" ]]; then
                dbt=true
              fi
              if [[ "$apis" == false && "$astro" == false && "$dbt" == false ]]; then
                verify_only=true
              fi
              ;;
          esac
          printf 'apis=%s\nastro=%s\ndbt=%s\nverify_only=%s\n' \
            "$apis" "$astro" "$dbt" "$verify_only" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build both APIs
    needs: check_changes
    if: needs.check_changes.outputs.apis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: |
          python -m pip install -r api/source/requirements.txt -r api/target/requirements.txt \
            -r integration/requirements.txt 'httpx>=0.28,<1'
          python -m unittest discover -s tests -v

      - name: Build both API images
        shell: bash
        run: |
          for api in source target; do
            docker build --build-arg APP_IMAGE_TAG="$GITHUB_SHA" \
              --tag "ghcr.io/susinda/purchase-order-$api:$GITHUB_SHA" "api/$api"
          done

      - name: Publish both tested images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for api in source target; do
            image="ghcr.io/susinda/purchase-order-$api"
            docker image tag "$image:$GITHUB_SHA" "$image:latest"
            docker image push "$image:$GITHUB_SHA"
            docker image push "$image:latest"
          done

  deploy_apis:
    name: Deploy both APIs to Coolify test
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
      SOURCE_API_URL: ${{ vars.SOURCE_API_URL }}
      TARGET_API_URL: ${{ vars.TARGET_API_URL }}
    steps:
      - name: Check test API URLs are configured
        run: |
          : "${SOURCE_API_URL:?Set SOURCE_API_URL in the test environment}"
          : "${TARGET_API_URL:?Set TARGET_API_URL in the test environment}"

      - name: Update IMAGE_TAG in Coolify
        env:
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          # The bulk endpoint also creates IMAGE_TAG on the first deploy.
          curl -fsS --proto '=https' --max-time 15 -X PATCH \
            "${COOLIFY_API_URL%/}/services/$COOLIFY_SERVICE_UUID/envs/bulk" \
            -H "Authorization: Bearer $COOLIFY_AUTH_TOKEN" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d "{\"data\":[{\"key\":\"IMAGE_TAG\",\"value\":\"$GITHUB_SHA\"}]}" -o /dev/null

      - name: Trigger Coolify deployment
        shell: bash
        env:
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          curl -fsS --proto '=https' --max-time 15 -X POST \
            "${COOLIFY_API_URL%/}/deploy?uuid=$COOLIFY_SERVICE_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_AUTH_TOKEN" -H 'Accept: application/json' |
            jq -er --arg uuid "$COOLIFY_SERVICE_UUID" '
              .deployments[] | select(.resource_uuid == $uuid) | .message |
              if startswith("Service ") then . else error("Coolify did not accept deployment: " + .) end'

  deploy_astro:
    name: Deploy Airflow image and DAGs to Astro
    needs: check_changes
    if: needs.check_changes.outputs.astro == 'true'
    concurrency:
      group: astro-dag-deploy-test
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    env:
      ASTRO2_DEPLOYMENT_ID: ${{ vars.ASTRO2_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Astro deployment inputs
        env:
          ASTRO2_API_TOKEN: ${{ secrets.ASTRO2_API_TOKEN }}
        run: |
          : "${ASTRO2_DEPLOYMENT_ID:?Set the ASTRO2_DEPLOYMENT_ID variable in the test environment}"
          : "${ASTRO2_API_TOKEN:?Set the ASTRO2_API_TOKEN secret in the test environment}"

      - name: Install Astro CLI
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: '1.45.0'

      - name: Deploy the Astro image and DAGs
        uses: astronomer/deploy-action@v0.17.0
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO2_API_TOKEN }}
        with:
          checkout: 'false'
          deployment-id: ${{ env.ASTRO2_DEPLOYMENT_ID }}
          deploy-type: image-and-dags
          root-folder: airflow
          no-dags-base-dir: 'true'
          skip-unchanged: 'false'
          wake-on-deploy: 'true'

  validate_dbt:
    name: Validate Snowflake dbt project files
    needs: check_changes
    if: needs.check_changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check required dbt deployment files
        shell: bash
        run: |
          for file in snowflake/dbt/dbt_project.yml snowflake/dbt/profiles.yml; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required dbt deployment file is missing or empty."
              exit 1
            fi
          done

  deploy_dbt:
    name: Publish dbt project to Snowflake
    needs: validate_dbt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    concurrency:
      group: snowflake-project-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT || secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: GITHUB_CICD_USER
      SNOWFLAKE_ROLE: PURCHASE_ORDER_PIPELINE_ROLE
      SNOWFLAKE_WAREHOUSE: PO_WAREHOUSE
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Snowflake account setting
        run: |
          : "${SNOWFLAKE_ACCOUNT:?Set SNOWFLAKE_ACCOUNT in the GitHub test environment}"

      - name: Install Snowflake CLI and obtain an OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: Publish transformation source files
        run: |
          snow dbt deploy PO_DBT_PROJECT --source snowflake/dbt \
            --database PURCHASE_ORDER_DB --schema TRANSFORM --dbt-version 1.12.3 -x

  verify_services:
    name: Verify deployed services
    needs: [check_changes, deploy_apis, deploy_astro, deploy_dbt]
    if: >-
      !cancelled() &&
      (needs.check_changes.outputs.verify_only == 'true' ||
      needs.deploy_apis.result == 'success' || needs.deploy_astro.result == 'success' ||
      needs.deploy_dbt.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      VERIFY_KAFKA: >-
        ${{ needs.check_changes.outputs.verify_only == 'true' || needs.deploy_astro.result == 'success' ||
        needs.deploy_dbt.result == 'success' }}
      VERIFY_DBT: ${{ needs.check_changes.outputs.verify_only == 'true' || needs.deploy_dbt.result == 'success' }}
      EXPECTED_IMAGE_TAG: ${{ needs.deploy_apis.result == 'success' && github.sha || '' }}
      ASTRO2_DEPLOYMENT_ID: ${{ vars.ASTRO2_DEPLOYMENT_ID }}
      AIRFLOW_BASE_URL: ${{ vars.AIRFLOW_BASE_URL || secrets.AIRFLOW_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Astro CLI for Airflow URL discovery
        id: astro_cli
        if: env.AIRFLOW_BASE_URL == '' && env.ASTRO2_DEPLOYMENT_ID != ''
        continue-on-error: true
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: '1.45.0'

      - name: Check Airflow base URL
        id: airflow_url
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ASTRO_CLI_OUTCOME: ${{ steps.astro_cli.outcome }}
          ASTRO_API_TOKEN: ${{ secrets.ASTRO2_API_TOKEN }}
        run: |
          url=$AIRFLOW_BASE_URL
          if [[ -z "$url" && "$ASTRO_CLI_OUTCOME" == success && -n "$ASTRO_API_TOKEN" ]]; then
            if url=$(astro deployment inspect "$ASTRO2_DEPLOYMENT_ID" --key metadata.airflow_api_url --clean-output); then
              if [[ -n "$url" && "$url" != *://* ]]; then
                url="https://$url"
              fi
              url=${url%/}
              url=${url%/api/v[12]}
              url=${url%/home}
            else
              url=''
            fi
          fi

          if [[ -z "$url" ]]; then
            echo '::warning::Airflow health check skipped. Set AIRFLOW_BASE_URL or configure Astro deployment URL discovery in the GitHub test environment.'
            exit 0
          fi
          url=${url%/}
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$ || "$url" =~ /api/v[12](/|$) ]]; then
            echo '::warning::Airflow health check skipped. Use an HTTPS Airflow base URL without an API path, query, or fragment.'
            exit 0
          fi
          printf 'health_url=%s/api/v2/monitor/health\n' "$url" >> "$GITHUB_OUTPUT"
          echo 'Airflow base URL is configured.'

      - name: Check Source API health
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SOURCE_API_URL: ${{ vars.SOURCE_API_URL }}
        run: |
          if [[ -z "$SOURCE_API_URL" ]]; then
            echo '::warning::Source API health check skipped. Set SOURCE_API_URL in the GitHub test environment.'
            exit 0
          fi
          echo "Checking Source API at ${SOURCE_API_URL%/}/health"
          if ! python3 tests/check_api.py health "$SOURCE_API_URL" --image-tag="$EXPECTED_IMAGE_TAG"; then
            echo '::warning::Source API did not return a healthy response from /health.'
          fi

      - name: Check Target API health
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TARGET_API_URL: ${{ vars.TARGET_API_URL }}
        run: |
          if [[ -z "$TARGET_API_URL" ]]; then
            echo '::warning::Target API health check skipped. Set TARGET_API_URL in the GitHub test environment.'
            exit 0
          fi
          echo "Checking Target API at ${TARGET_API_URL%/}/health"
          if ! python3 tests/check_api.py health "$TARGET_API_URL" --image-tag="$EXPECTED_IMAGE_TAG"; then
            echo '::warning::Target API did not return a healthy response from /health.'
          fi

      - name: Check Kafka topic exists
        if: ${{ !cancelled() && env.VERIFY_KAFKA == 'true' }}
        shell: bash
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS || secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_TOPIC: ${{ vars.KAFKA_TOPIC }}
          KAFKA_SECURITY_PROTOCOL: ${{ vars.KAFKA_SECURITY_PROTOCOL }}
          KAFKA_SASL_MECHANISM: ${{ vars.KAFKA_SASL_MECHANISM }}
          KAFKA_CONSUMER_SASL_USERNAME: ${{ vars.KAFKA_CONSUMER_SASL_USERNAME || secrets.KAFKA_CONSUMER_SASL_USERNAME }}
          KAFKA_CONSUMER_SASL_PASSWORD: ${{ secrets.KAFKA_CONSUMER_SASL_PASSWORD }}
          KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}
        run: |
          if [[ -z "$KAFKA_CONSUMER_SASL_PASSWORD" ]]; then
            echo '::notice::Kafka check skipped. Set the KAFKA_CONSUMER_SASL_PASSWORD secret in the GitHub test environment to enable it.'
            exit 0
          fi
          if [[ -z "$KAFKA_BOOTSTRAP_SERVERS" ]]; then
            KAFKA_BOOTSTRAP_SERVERS=$(PYTHONPATH=airflow python3 -c 'from include.po_settings import get_setting; print(get_setting("KAFKA_BOOTSTRAP_SERVERS", ""))')
            export KAFKA_BOOTSTRAP_SERVERS
          fi
          : "${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in the GitHub test environment or airflow/env.vars}"
          if [[ -z "$KAFKA_CA_PEM" ]]; then
            export KAFKA_SSL_CAFILE=airflow/aiven_ca.pem
          fi
          venv="$RUNNER_TEMP/kafka-check"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -r integration/requirements.txt
          timeout 45s "$venv/bin/python" -m integration.kafka_check

      - name: Check Airflow scheduler and metadata database health
        if: ${{ !cancelled() && steps.airflow_url.outputs.health_url != '' }}
        shell: bash
        env:
          ASTRO2_API_TOKEN: ${{ secrets.ASTRO2_API_TOKEN }}
          AIRFLOW_HEALTH_URL: ${{ steps.airflow_url.outputs.health_url }}
        run: |
          headers=(-H 'Accept: application/json')
          if [[ -n "$ASTRO2_API_TOKEN" ]]; then
            headers+=(-H "Authorization: Bearer $ASTRO2_API_TOKEN")
          else
            echo '::notice::ASTRO2_API_TOKEN is unset. Checking the Airflow endpoint without authentication.'
          fi
          if ! response=$(curl -fsS --proto '=https' --max-time 10 --retry 2 --retry-max-time 25 \
            "${headers[@]}" "$AIRFLOW_HEALTH_URL"); then
            echo '::warning::Airflow health endpoint did not return a successful response. Check AIRFLOW_BASE_URL and ASTRO2_API_TOKEN.'
          elif ! jq -se 'length == 1 and (.[0] | .metadatabase.status == "healthy" and .scheduler.status == "healthy")' <<< "$response" >/dev/null; then
            echo '::warning::Airflow is reachable, but its health response did not confirm a healthy scheduler and metadata database.'
          else
            echo 'Airflow is reachable. Its scheduler and metadata database are healthy.'
          fi

      - name: Install Snowflake CLI and obtain an OIDC token for verification
        id: snowflake_auth
        if: ${{ !cancelled() && env.VERIFY_DBT == 'true' }}
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: Check TRANSFORM dbt project exists
        if: ${{ !cancelled() && steps.snowflake_auth.outcome == 'success' }}
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT || secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: GITHUB_CICD_USER
          SNOWFLAKE_ROLE: PURCHASE_ORDER_PIPELINE_ROLE
          SNOWFLAKE_WAREHOUSE: PO_WAREHOUSE
        run: |
          : "${SNOWFLAKE_ACCOUNT:?Set SNOWFLAKE_ACCOUNT in the GitHub test environment}"
          snow sql -x -q 'DESCRIBE DBT PROJECT PURCHASE_ORDER_DB.TRANSFORM.PO_DBT_PROJECT'
