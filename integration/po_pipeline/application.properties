# Initialization and provisioning
# Environment references resolve when a command uses them. Keep values in secrets or .env.
aiven.project=${AIVEN_PROJECT}
aiven.service.name=${AIVEN_SERVICE_NAME}
aiven.api.token=${AIVEN_API_TOKEN}

# Apply these settings only when creating a Kafka topic.
kafka.topic.partitions=1
kafka.topic.replication=2
kafka.topic.retention.hours=72

# Local Kafka tools
source.api.url=${SOURCE_API_URL}
source.api.username=${SOURCE_API_USERNAME}
source.api.password=${SOURCE_API_PASSWORD}

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.security.protocol=SASL_SSL
kafka.sasl.mechanism=SCRAM-SHA-256
kafka.sasl.password=${KAFKA_SASL_PASSWORD}
kafka.topic=purchase-orders
kafka.backend.dlt=purchase-orders.backend.dlt
kafka.analytics.dlt=purchase-orders.analytics.dlt
kafka.producer.username=airflow-producer
kafka.producer.password=${KAFKA_PRODUCER_SASL_PASSWORD}
kafka.consumer.username=airflow-consumer
kafka.backend.group=purchase-orders-backend
kafka.analytics.group=purchase-orders-analytics

# Optional local inspection CLI identity. This user and its ACLs are managed separately.
kafka.inspection.username=purchaseorders-demo
kafka.inspection.password=${KAFKA_INSPECTION_SASL_PASSWORD}
kafka.inspection.group=purchaseorders-consumer
kafka.inspection.client.id=purchaseorders-inspector
kafka.inspection.offset.reset=earliest
