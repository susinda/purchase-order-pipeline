name: Initialize environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to initialize
        type: environment
        required: true
        default: test
      component:
        description: What to initialize (Snowflake is configured for test)
        type: choice
        default: all
        options: [all, mysql-and-kafka, snowflake]

permissions:
  contents: read

concurrency:
  group: initialize-environment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  initialize:
    name: Initialize MySQL and Aiven Kafka
    if: inputs.component != 'snowflake'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MySQL initializer dependencies
        run: python -m pip install -r api/target/requirements.txt

      - name: Initialize Target API tables in MySQL
        env:
          MYSQL_HOST: ${{ vars.MYSQL_HOST }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT || '3306' }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_INIT_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_INIT_PASSWORD }}
        run: |
          echo '[MySQL] Ensuring the Target API tables exist.'
          python -m api.target.init_db
          echo '[MySQL] Target API schema is ready.'

      - name: Initialize Aiven topics, service users, and ACLs
        env:
          AIVEN_PROJECT: ${{ vars.AIVEN_PROJECT }}
          AIVEN_SERVICE_NAME: ${{ vars.AIVEN_SERVICE_NAME }}
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
        run: |
          echo '[Aiven] Checking Kafka topics, service users, and access rules.'
          python -m integration.provision_kafka
          echo '[Aiven] Kafka provisioning is complete.'

      - name: Report initialization result
        run: echo '[Init] MySQL and Aiven initialization completed successfully.'

  initialize_snowflake:
    name: Initialize Snowflake warehouse
    if: inputs.component == 'snowflake' || (inputs.component == 'all' && inputs.environment == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    concurrency:
      group: snowflake-project-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT || secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: GITHUB_CICD_USER
      SNOWFLAKE_ROLE: PURCHASE_ORDER_PIPELINE_ROLE
      SNOWFLAKE_WAREHOUSE: PO_WAREHOUSE
      SNOWFLAKE_RAW_TABLE: ${{ vars.SNOWFLAKE_RAW_TABLE || 'PURCHASE_ORDER_DB.RAW.PURCHASE_ORDER_EVENTS' }}
    steps:
      - name: Validate Snowflake settings
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$TARGET_ENVIRONMENT" != test ]]; then
            echo '::error::Select test. The Snowflake GitHub workload identity is configured for that environment.'
            exit 1
          fi
          : "${SNOWFLAKE_ACCOUNT:?Set SNOWFLAKE_ACCOUNT in the GitHub test environment}"
          if [[ ! "$SNOWFLAKE_RAW_TABLE" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*){2}$ ]]; then
            echo '::error::SNOWFLAKE_RAW_TABLE must be DATABASE.SCHEMA.TABLE using unquoted identifiers.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Snowflake CLI and obtain an OIDC token
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: Initialize the RAW, CLEAN, and BIZ objects
        run: |
          snow sql -x \
            -f snowflake/init/initialize-raw.sql \
            -f snowflake/dbt/ddl/warehouse.sql \
            -D "raw_table=$SNOWFLAKE_RAW_TABLE" \
            -D "database=${SNOWFLAKE_RAW_TABLE%%.*}"
