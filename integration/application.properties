# Non-secret settings for the Aiven Kafka provisioning workflow.
# Replace this with the existing Aiven Kafka service username.
kafka.username=purchaseorders-demo
kafka.topic=purchaseorders
# Comma-separated Kafka group IDs this user may join.
kafka.group.ids=purchaseorders-backend-consumer,purchaseorders-analytics-consumer

# These settings apply only when the topic is first created.
kafka.topic.partitions=1
kafka.topic.replication=2
kafka.topic.retention.hours=72
