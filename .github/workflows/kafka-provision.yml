name: Provision Aiven Kafka

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-aiven-kafka-test
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create missing topics, service users and access rules
        env:
          AIVEN_PROJECT: ${{ vars.AIVEN_PROJECT }}
          AIVEN_SERVICE_NAME: ${{ vars.AIVEN_SERVICE_NAME }}
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
        run: python3 -m integration.provision_kafka
