name: Initialize environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to initialize
        type: environment
        required: true
        default: test
      deploy_runtime:
        description: Build and deploy the Astro runtime with Kafka and Snowflake dependencies
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: astro-dag-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MySQL initializer dependencies
        run: python -m pip install -r api/target/requirements.txt

      - name: Initialize Target API tables in MySQL
        env:
          MYSQL_HOST: ${{ vars.MYSQL_HOST }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT || '3306' }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_INIT_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_INIT_PASSWORD }}
        run: |
          echo '[MySQL] Ensuring the Target API tables exist.'
          python -m api.target.init_db
          echo '[MySQL] Target API schema is ready.'

      - name: Initialize Aiven topics, service users, and ACLs
        env:
          AIVEN_PROJECT: ${{ vars.AIVEN_PROJECT }}
          AIVEN_SERVICE_NAME: ${{ vars.AIVEN_SERVICE_NAME }}
          AIVEN_API_TOKEN: ${{ secrets.AIVEN_API_TOKEN }}
        run: |
          echo '[Aiven] Checking Kafka topics, service users, and access rules.'
          python -m integration.provision_kafka
          echo '[Aiven] Kafka provisioning is complete.'

      - name: Prepare the Astro runtime build
        if: inputs.deploy_runtime
        env:
          ASTRO_DEPLOYMENT_ID: ${{ vars.ASTRO_DEPLOYMENT_ID }}
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
        run: |
          : "${ASTRO_DEPLOYMENT_ID:?Set the ASTRO_DEPLOYMENT_ID variable in the selected GitHub environment}"
          : "${ASTRO_API_TOKEN:?Set the ASTRO_API_TOKEN secret in the selected GitHub environment}"
          echo '[Astro] Staging DAGs and runtime dependencies for the image build.'
          cp -R dags airflow/

      - name: Install Astro CLI
        if: inputs.deploy_runtime
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: '1.45.0'

      - name: Deploy the Astro runtime image and DAGs
        if: inputs.deploy_runtime
        uses: astronomer/deploy-action@v0.17.0
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
        with:
          checkout: 'false'
          deployment-id: ${{ vars.ASTRO_DEPLOYMENT_ID }}
          deploy-type: image-and-dags
          root-folder: airflow
          dags-path: dags
          no-dags-base-dir: 'true'
          skip-unchanged: 'false'
          wake-on-deploy: 'true'

      - name: Report Astro runtime deployment
        if: inputs.deploy_runtime
        run: echo '[Astro] Runtime image and DAG deployment completed.'

      - name: Report skipped Astro runtime deployment
        if: ${{ !inputs.deploy_runtime }}
        run: |
          echo '[Astro] Runtime deployment skipped. Enable deploy_runtime if Kafka or Snowflake dependencies need to be installed.'

      - name: Snowflake initialization status
        run: |
          echo '[Snowflake] Database, schema, and managed dbt project setup is handled separately for now.'
          echo '[Snowflake] The analytics DAG creates the required tables and runs dbt after a complete batch.'

      - name: Report initialization result
        run: echo '[Init] MySQL and Aiven initialization completed successfully.'
