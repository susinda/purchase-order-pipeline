name: Astronomer CI - Deploy DAGs

on:
  push:
    branches: [main]
    paths:
      - 'dags/**'
  workflow_dispatch:
    inputs:
      deploy_runtime:
        description: Build and deploy the Astro runtime image as well as the DAGs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: astro-dag-deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Astro deployment inputs
        env:
          ASTRO_DEPLOYMENT_ID: ${{ vars.ASTRO_DEPLOYMENT_ID }}
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
        run: |
          : "${ASTRO_DEPLOYMENT_ID:?Set the ASTRO_DEPLOYMENT_ID variable in the test environment}"
          : "${ASTRO_API_TOKEN:?Set the ASTRO_API_TOKEN secret in the test environment}"
          if [[ ! -d dags ]]; then
            echo '::error::Add the dags/ directory before deploying to Astro.'
            exit 1
          fi

      - name: Install Astro CLI
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: '1.45.0'

      - name: Stage DAGs for the Astro runtime build
        if: inputs.deploy_runtime
        run: cp -R dags airflow/

      - name: Deploy DAGs to Astro
        uses: astronomer/deploy-action@v0.17.0
        env:
          ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
        with:
          checkout: 'false'
          deployment-id: ${{ vars.ASTRO_DEPLOYMENT_ID }}
          deploy-type: ${{ inputs.deploy_runtime && 'image-and-dags' || 'dags-only' }}
          root-folder: ${{ inputs.deploy_runtime && 'airflow' || '' }}
          dags-path: dags
          no-dags-base-dir: 'true'
          wake-on-deploy: 'true'
