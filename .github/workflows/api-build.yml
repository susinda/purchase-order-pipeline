name: Test, publish, and deploy APIs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build both APIs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build both API images and run unit tests
        shell: bash
        run: |
          for api in source target; do
            docker build --file "api/$api/Dockerfile" \
              --build-arg APP_IMAGE_TAG="$GITHUB_SHA" \
              --tag "ghcr.io/susinda/purchase-order-$api:$GITHUB_SHA" .
          done

      - name: Publish both tested images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for api in source target; do
            docker image push "ghcr.io/susinda/purchase-order-$api:$GITHUB_SHA"
          done

  deploy:
    name: Deploy both APIs to Coolify
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
      SOURCE_API_URL: ${{ vars.SOURCE_API_URL || 'https://source.praxams.com' }}
      TARGET_API_URL: ${{ vars.TARGET_API_URL || 'https://target.praxams.com' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Update IMAGE_TAG in Coolify
        env:
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: bash scripts/deploy_coolify.sh update-tag

      - name: Trigger Coolify deploy
        env:
          COOLIFY_AUTH_TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: bash scripts/deploy_coolify.sh deploy

      # Coolify queues deployments asynchronously. The old release may still
      # answer while images pull and start, so wait for this commit on both APIs.
      - name: Wait for both deployed APIs to serve the new release
        run: |
          python3 scripts/check_api.py health "$SOURCE_API_URL" --image-tag "$GITHUB_SHA"
          python3 scripts/check_api.py health "$TARGET_API_URL" --image-tag "$GITHUB_SHA"

      - name: Read the deployed Source API with Basic Auth
        env:
          SOURCE_API_USERNAME: ${{ secrets.SOURCE_API_USERNAME }}
          SOURCE_API_PASSWORD: ${{ secrets.SOURCE_API_PASSWORD }}
        run: |
          if [[ -z "$SOURCE_API_USERNAME" && -z "$SOURCE_API_PASSWORD" ]]; then
            echo '::notice::Source API authenticated smoke check skipped because its secrets are absent.'
            exit 0
          fi
          : "${SOURCE_API_USERNAME:?Set the SOURCE_API_USERNAME secret}"
          : "${SOURCE_API_PASSWORD:?Set the SOURCE_API_PASSWORD secret}"
          python3 scripts/check_api.py source-smoke "$SOURCE_API_URL"

      - name: Verify Kafka topic metadata from the deployment runner
        if: vars.KAFKA_BOOTSTRAP_SERVERS != ''
        timeout-minutes: 2
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_TOPIC: ${{ vars.KAFKA_TOPIC || 'purchaseorders' }}
          KAFKA_SECURITY_PROTOCOL: ${{ vars.KAFKA_SECURITY_PROTOCOL }}
          KAFKA_SASL_MECHANISM: ${{ vars.KAFKA_SASL_MECHANISM }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}
        run: |
          export KAFKA_SECURITY_PROTOCOL="${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}"
          export KAFKA_SASL_MECHANISM="${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}"
          if [[ -n "$KAFKA_CA_PEM" ]]; then
            KAFKA_SSL_CAFILE=$(mktemp "$RUNNER_TEMP/kafka-ca.XXXXXX")
            trap 'rm -f -- "$KAFKA_SSL_CAFILE"' EXIT
            printf '%s\n' "$KAFKA_CA_PEM" > "$KAFKA_SSL_CAFILE"
            export KAFKA_SSL_CAFILE
          fi
          unset KAFKA_CA_PEM
          python3 -m venv "$RUNNER_TEMP/kafka-smoke"
          "$RUNNER_TEMP/kafka-smoke/bin/python" -m pip install -r integration/requirements.txt
          "$RUNNER_TEMP/kafka-smoke/bin/python" -m integration.kafka_check
